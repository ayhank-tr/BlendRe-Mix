name: windows

# BGE-Remix Windows build and tests.
# Builds Blender 2.79b (blender.exe + blenderplayer.exe) with Visual Studio 2022
# (v143) against Blender 2.79's own pre-compiled vc14 libraries, with the
# official release options. Then runs the phase 0 tests against official
# Blender 2.79b, using Mesa's software OpenGL (the CI machines have no GPU).

on:
  push:
  workflow_dispatch:

env:
  LIB_URL: https://svn.blender.org/svnroot/bf-blender/tags/blender-2.79a-release/lib/win64_vc14
  LIB_KEY: lib-win64_vc14-blender-2.79a-release
  OFFICIAL_URL: https://download.blender.org/release/Blender2.79/blender-2.79b-windows64.zip
  # NVIDIA PhysX 5 (P6), Apache 2.0
  PHYSX_TAG: 110.3-omni-and-physx-5.9.1

jobs:
  # Blender 2.79's pre-compiled Windows libraries (the 2.79a tag also covers
  # 2.79b: no library changes), fetched once and cached.
  libs:
    runs-on: windows-2022
    timeout-minutes: 120
    # one download at a time across branches and tags: svn.blender.org refuses
    # parallel downloads (P0's first run on main)
    concurrency:
      group: blender-279-libs
      cancel-in-progress: false
    steps:
      - name: Restore libraries
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: lib/win64_vc14
          key: ${{ env.LIB_KEY }}
          lookup-only: true

      - name: Download libraries (Blender SVN)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install sliksvn -y --no-progress
          $env:Path += ";C:\Program Files\SlikSvn\bin"
          $ok = $false
          for ($i = 1; $i -le 8 -and -not $ok; $i++) {
            if (Test-Path lib/win64_vc14/.svn) {
              svn cleanup lib/win64_vc14
              svn update --non-interactive --trust-server-cert lib/win64_vc14
            } else {
              svn checkout --quiet --non-interactive --trust-server-cert $env:LIB_URL lib/win64_vc14
            }
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "attempt $i failed, waiting"; Start-Sleep -Seconds (60 * $i) }
          }
          if (-not $ok) { exit 1 }
          Remove-Item -Recurse -Force lib/win64_vc14/.svn

      - name: Save libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lib/win64_vc14
          key: ${{ env.LIB_KEY }}

  # NVIDIA PhysX 5.9.1 (P6): static libraries and PhysXGpu_64.dll, built with
  # CUDA 12.8 once and cached (the key changes with build_files/physx)
  physx:
    runs-on: windows-2022
    timeout-minutes: 300
    concurrency:
      group: physx-sdk
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: blender
          sparse-checkout: build_files/physx

      - name: Restore PhysX
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: physx_sdk
          key: physx-${{ env.PHYSX_TAG }}-${{ hashFiles('blender/build_files/physx/**') }}
          lookup-only: true

      - name: CUDA 12.8
        if: steps.cache.outputs.cache-hit != 'true'
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: network
          sub-packages: '["nvcc", "cudart", "thrust", "nvtx", "visual_studio_integration"]'
          use-github-cache: false
          use-local-cache: false

      - name: PhysX source
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:PHYSX_TAG --filter=blob:none --sparse https://github.com/NVIDIA-Omniverse/PhysX.git physx_src
          git -C physx_src sparse-checkout set physx
          Get-Content physx_src/physx/version.txt

      - name: Build PhysX
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          blender/build_files/physx/build_physx.ps1 -PhysX physx_src/physx -Cuda "${{ steps.cuda.outputs.CUDA_PATH }}" -Out physx_sdk 2>&1 | Tee-Object -FilePath physx_build.log
          if (-not $?) { exit 1 }
          Write-Host "PhysX build: $([math]::Round($t.Elapsed.TotalMinutes, 1)) minutes"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: physx-build-log
          path: physx_build.log
          if-no-files-found: ignore

      - name: Save PhysX
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: physx_sdk
          key: physx-${{ env.PHYSX_TAG }}-${{ hashFiles('blender/build_files/physx/**') }}

  build:
    needs: [libs, physx]
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: blender

      - name: Restore libraries
        uses: actions/cache/restore@v4
        with:
          path: lib/win64_vc14
          key: ${{ env.LIB_KEY }}
          fail-on-cache-miss: true

      - name: Restore PhysX
        uses: actions/cache/restore@v4
        with:
          path: physx_sdk
          key: physx-${{ env.PHYSX_TAG }}-${{ hashFiles('blender/build_files/physx/**') }}
          fail-on-cache-miss: true

      # Official 2.79b release options; CUDA kernels off (2.79b's kernels stop
      # at sm_61 and need CUDA 8, so they would not run on RTX cards anyway).
      - name: Configure
        shell: pwsh
        run: |
          cmake -S blender -B build -G "Visual Studio 17 2022" -A x64 -T v143 `
            -C blender/build_files/cmake/config/blender_release.cmake `
            -DWITH_CYCLES_CUDA_BINARIES=OFF `
            -DWITH_LTO=ON -DWITH_CPU_AVX2=ON -DWITH_MEM_MIMALLOC=ON `
            -DWITH_PHYSX=ON -DPHYSX_ROOT_DIR="$pwd/physx_sdk" `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $lines = Select-String -Path configure.log -Pattern 'CMake Error' -Context 0,4 | Select-Object -First 8 |
              ForEach-Object { (@($_.Line) + $_.Context.PostContext) -join '%0A' }
            foreach ($l in $lines) { Write-Output "::error title=Configure error::$l" }
            exit 1
          }


      - name: Build
        id: build
        shell: pwsh
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          cmake --build build --config Release --target INSTALL -- /m /v:minimal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            # The errors as annotations, readable on the run page without signing in
            $lines = Select-String -Path build.log -Pattern 'error C\d+|error LNK\d+|fatal error|error MSB\d+|CMake Error' |
              Select-Object -First 60 | ForEach-Object { $_.Line.Trim() }
            $i = 0
            while ($i -lt $lines.Count) {
              $chunk = $lines[$i..([math]::Min($i + 5, $lines.Count - 1))] -join '%0A'
              Write-Output "::error title=Build error::$chunk"
              $i += 6
            }
            exit 1
          }
          $t.Stop()
          "build_minutes=$([math]::Round($t.Elapsed.TotalMinutes, 1))" | Tee-Object -FilePath build/bin/Release/BUILD_TIME.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: blendremix-win64
          path: build/bin/Release

      # P6: the PhysX backend on its own (CPU scenes, no Blender): stacking,
      # bounce, friction, sensors, rays, joints, character, vehicle
      - name: PhysX native checks
        shell: pwsh
        run: |
          cmake -S blender/tests/bge_remix/p6/native -B p6native -G "Visual Studio 17 2022" -A x64 -DPHYSX_ROOT_DIR="$pwd/physx_sdk"
          cmake --build p6native --config Release -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          p6native/Release/p6_physx_checks.exe
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=PhysX native checks::some checks failed (see the log)"; exit 1 }

  test:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: blender

      - uses: actions/download-artifact@v4
        with:
          name: blendremix-win64
          path: ours

      - name: Official Blender 2.79b
        shell: pwsh
        run: |
          Invoke-WebRequest $env:OFFICIAL_URL -OutFile official.zip
          Expand-Archive official.zip -DestinationPath .
          Get-ChildItem blender-2.79b-windows64 | Select-Object -First 5 Name

      - name: Mesa software OpenGL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --output mesa.7z
          7z x mesa.7z -omesa | Out-Null
          Get-ChildItem mesa/x64 -Filter *.dll | Select-Object Name

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Phase 0 tests (T1.7 regression, B1.1 startup)
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python -m pip install --quiet pillow numpy
          python blender/tests/bge_remix/p0/run_p0.py --ours ours --official blender-2.79b-windows64 --out results --mesa mesa/x64

      # The fake RTX Remix runtime (d3d9.dll) for the phase 1 tests
      - name: Build the fake Remix runtime
        shell: pwsh
        run: |
          cmake -S blender/tests/bge_remix/p1/mock_remix -B mockbuild -G "Visual Studio 17 2022" -A x64
          cmake --build mockbuild --config Release -- /m /v:minimal
          New-Item -ItemType Directory -Force mock, mock_shim | Out-Null
          Copy-Item mockbuild/Release/d3d9.dll mock/
          Copy-Item mockbuild/Release/d3d9.dll, mockbuild/Release/d3d9_x64.dll, mockbuild/Release/remixdep.dll mock_shim/

      - name: Phase 1 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p1/run_p1.py --ours ours --mock mock --mock-shim mock_shim --out results/p1

      - name: Phase 2 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p2/run_p2.py --ours ours --mock mock --out results/p2

      - name: Phase 3 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p3/run_p3.py --ours ours --mock mock --official blender-2.79b-windows64 --out results/p3

      - name: Phase 4 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p4/run_p4.py --ours ours --mock mock --official blender-2.79b-windows64 --out results/p4

      - name: Phase 5 tests (fake runtime)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p5/run_p5.py --ours ours --mock mock --out results/p5

      - name: Phase 6 tests (PhysX on the CPU)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p6/run_p6.py --ours ours --official blender-2.79b-windows64 --out results/p6

      - name: Phase 7 study (the Game View before building it)
        if: always()
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python blender/tests/bge_remix/p7/run_p7_study.py --ours ours --out results/p7_study

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-results
          path: results
